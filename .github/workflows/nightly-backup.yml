# Every night: copy the database and all photos, encrypt them, and keep them in Cloudflare R2.
# What it does and how to restore: docs/BACKUPS.md. The script itself: scripts/backup/backup.js.
#
# If a run fails, GitHub emails the repo owner. The "Run workflow" button on the Actions tab
# starts one by hand.
name: Nightly backup

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC = 05:00 in Tbilisi, when nobody is decorating
  workflow_dispatch:

permissions:
  contents: read

# Never two at once (e.g. a hand-started run during the nightly one).
concurrency: backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run backup
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NODE_NO_WARNINGS: 1
