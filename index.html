<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7b6fa8" />
    <title>Cozy Town</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Loading screen styles live here (not in styles.css) so it appears instantly, before any JavaScript loads. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(to bottom, #7b6fa8 0%, #f4a58a 38%, #f6cfae 60%);
        color: #fff6e9;
        font-family: 'Nunito', 'Noto Sans Georgian', sans-serif;
        transition: opacity 0.5s ease;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot svg {
        width: 104px;
        height: 104px;
        filter: drop-shadow(0 6px 12px rgba(74, 59, 51, 0.25));
        animation: boot-bob 2s ease-in-out infinite;
      }
      #boot-title {
        font-size: 1.7rem;
        font-weight: 800;
        color: #4a3b33;
      }
      #boot .dots {
        display: flex;
        gap: 8px;
      }
      #boot .dots span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #7a6558;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      #boot .dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      #boot .dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes boot-bob {
        50% {
          transform: translateY(-8px);
        }
      }
      @keyframes boot-pulse {
        0%, 100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg,
        #boot .dots span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect x="64" y="14" width="10" height="22" fill="#b5654a" />
        <polygon points="50,10 92,48 8,48" fill="#c2553f" />
        <rect x="18" y="46" width="64" height="44" fill="#f6e7d0" />
        <path d="M42 90 V70 a8 8 0 0 1 16 0 V90 Z" fill="#3f6e8c" />
        <rect x="24" y="56" width="13" height="13" fill="#ffe29a" />
        <rect x="63" y="56" width="13" height="13" fill="#ffe29a" />
        <circle cx="50" cy="35" r="5" fill="#ffe29a" />
      </svg>
      <div id="boot-title">მყუდრო ქალაქი</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <script>
      try {
        if (localStorage.getItem('lang') === 'en') document.getElementById('boot-title').textContent = 'Cozy Town'
      } catch {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
