<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 135 390 704">
  <!-- The town map for tall screens, a hand-inked paper map. Its wide twin is town-map-wide.svg.
       No words in here: the names are real buttons on top, and each neighbourhood's territory
       is a tappable shape. src/map/places.js says where they go, in this drawing's own units. -->
  <defs>
    <!-- A slight wobble, so the lines look drawn by hand instead of by a machine -->
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4"/>
    </filter>
    <clipPath id="sheet"><rect x="15" y="145" width="360" height="684"/></clipPath>

    <g id="house">
      <polygon points="1,11 23,11 23,26 1,26" fill="#fff9ec"/>
      <polygon points="-3,11 12,0 27,11"/>
      <rect x="4" y="15" width="5" height="5" fill="#f2c14e" stroke-width="1"/>
      <path d="M14 26 V19 h5 V26" fill="none"/>
    </g>
    <!-- Two floors with a carved wooden balcony: the Old Town's look -->
    <g id="balcony">
      <polygon points="1,8 23,8 23,28 1,28" fill="#fff9ec"/>
      <polygon points="-3,8 12,-3 27,8"/>
      <rect x="4" y="10.5" width="4" height="4" fill="#f2c14e" stroke-width="1"/>
      <rect x="16" y="10.5" width="4" height="4" fill="#f2c14e" stroke-width="1"/>
      <path d="M-2 16.5 H26 M-2 20.5 H26 M1 16.5 v4 M5 16.5 v4 M9 16.5 v4 M13 16.5 v4 M17 16.5 v4 M21 16.5 v4" fill="none" stroke-width="1"/>
      <path d="M9 28 V23 h5 V28" fill="none"/>
    </g>
    <g id="tree">
      <path d="M0 8 V14" fill="none"/>
      <path d="M-7 4 C-10 -3 -3 -8 1 -7 C7 -8 10 -1 7 4 C6 8 -5 9 -7 4 Z" fill="#c6d6a8"/>
    </g>
    <g id="dark">
      <path d="M0 8 V14" fill="none"/>
      <path d="M-7 4 C-10 -3 -3 -8 1 -7 C7 -8 10 -1 7 4 C6 8 -5 9 -7 4 Z" fill="#9db98e"/>
    </g>
    <g id="pine">
      <path d="M0 -10 L7 4 H-7 Z" fill="#fff9ec"/>
      <path d="M0 4 V9" fill="none"/>
    </g>
    <g id="lantern">
      <circle r="5.5" fill="#f2c14e" opacity="0.35" stroke="none"/>
      <circle r="2" fill="#f2c14e" stroke-width="1"/>
    </g>
  </defs>

  <!-- The folds in the paper, inside the map's border -->
  <g clip-path="url(#sheet)" stroke-width="1.5">
    <path d="M130 135 V839 M260 135 V839 M0 420 H390" stroke="#d8c8a8" opacity="0.65"/>
    <path d="M131.5 135 V839 M261.5 135 V839 M0 421.5 H390" stroke="#fffaf0" opacity="0.8"/>
  </g>
  <rect x="10" y="140" width="370" height="694" fill="none" stroke="#4a3b33" stroke-width="1.6"/>
  <rect x="15" y="145" width="360" height="684" fill="none" stroke="#4a3b33" stroke-width="0.7"/>

  <g filter="url(#ink)" stroke="#4a3b33" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Soft colour washes, like watercolour under the ink -->
    <g stroke="none">
      <path d="M18 148 H372 V300 C300 318 230 292 160 312 C100 326 60 300 18 312 Z" fill="#e6e4ec" opacity="0.8"/>
      <path d="M18 330 C80 318 130 342 196 326 C190 410 204 500 192 606 C130 620 70 596 18 612 Z" fill="#efc9a2" opacity="0.55"/>
      <path d="M206 326 C260 314 320 338 372 320 V600 C320 616 260 592 204 610 C216 500 198 410 206 326 Z" fill="#cfe0c0" opacity="0.7"/>
      <path d="M18 626 C80 610 130 636 196 622 C260 606 320 630 372 612 V826 H18 Z" fill="#a9c6a0" opacity="0.6"/>
    </g>

    <!-- Mountains: outlines with hatching on their shaded sides -->
    <g fill="#fff9ec">
      <path d="M34 262 L92 170 L150 262"/>
      <path d="M128 268 L196 156 L268 268"/>
      <path d="M256 258 L306 186 L358 258"/>
    </g>
    <g fill="none" stroke-width="1">
      <path d="M100 186 L110 200 M106 196 L118 212 M112 206 L126 226 M118 218 L134 244 M124 232 L140 258"/>
      <path d="M206 174 L218 192 M212 186 L228 208 M220 198 L238 226 M228 214 L248 246 M236 230 L256 264"/>
      <path d="M314 200 L324 214 M320 212 L334 232 M328 226 L344 252"/>
      <path d="M80 190 L92 196 L102 188 M182 178 L196 186 L208 176 M296 200 L306 206 L316 198"/>
    </g>

    <!-- The stream off the mountain, the lake, and the river leaving by the bottom of the map -->
    <path d="M282 262 C280 272 284 278 282 286" fill="none" stroke-width="1"/>
    <path d="M280 304 C276 344 318 356 312 396 C306 440 262 456 272 500 C282 540 326 556 330 600 C334 650 318 700 340 760 C344 780 350 806 356 826" fill="none" stroke-width="15" stroke-linecap="butt"/>
    <path d="M280 304 C276 344 318 356 312 396 C306 440 262 456 272 500 C282 540 326 556 330 600 C334 650 318 700 340 760 C344 780 350 806 356 826" fill="none" stroke="#bcd8de" stroke-width="12.5" stroke-linecap="butt"/>
    <ellipse cx="284" cy="296" rx="27" ry="11" fill="#bcd8de"/>
    <path d="M270 294 q5 -3 10 0 M286 299 q5 -3 10 0" fill="none" stroke-width="1"/>
    <path d="M302 382 q4 -2.5 8 0 M278 462 q4 -2.5 8 0 M318 572 q4 -2.5 8 0 M322 680 q4 -2.5 8 0" fill="none" stroke-width="1"/>

    <!-- Paths, drawn as dotted walking routes -->
    <g fill="none" stroke-width="1.6" stroke-dasharray="1 6">
      <path d="M126 276 C136 320 104 350 116 400 C124 440 176 470 190 520 C200 560 186 600 190 650 C192 700 172 760 196 824"/>
      <path d="M150 452 C200 448 240 450 272 452 L356 442"/>
      <path d="M190 650 C150 660 96 662 68 706 M190 650 C232 664 280 680 262 750"/>
    </g>
    <!-- The little bridge -->
    <path d="M254 446 Q272 436 292 448 L292 458 Q272 446 254 456 Z" fill="#fff9ec"/>

    <!-- Snowy Hills -->
    <use href="#pine" x="36" y="284"/>
    <use href="#pine" x="170" y="286"/>
    <use href="#pine" x="344" y="280"/>
    <use href="#pine" x="62" y="298"/>
    <use href="#house" x="84" y="272" fill="#e8e2ea"/>
    <use href="#house" x="222" y="276" fill="#e8e2ea"/>

    <!-- Old Town, with carved balconies and its round stone tower -->
    <use href="#balcony" x="32" y="344" fill="#c8664c"/>
    <use href="#balcony" x="132" y="350" fill="#b45a42"/>
    <path d="M76 374 V344 H94 V374" fill="#fff9ec"/>
    <path d="M72 346 L85 320 L98 346 Z" fill="#b45a42"/>
    <path d="M82 364 V356 a3 3 0 0 1 6 0 V364 Z" fill="#f2c14e" stroke-width="1"/>
    <use href="#house" x="28" y="392" fill="#b45a42"/>
    <use href="#balcony" x="66" y="392" fill="#c8664c"/>
    <use href="#house" x="150" y="398" fill="#c8664c"/>
    <use href="#balcony" x="30" y="488" fill="#c8664c"/>
    <use href="#house" x="72" y="496" fill="#b45a42"/>
    <use href="#house" x="30" y="540" fill="#c8664c"/>
    <use href="#balcony" x="74" y="544" fill="#b45a42"/>
    <use href="#house" x="122" y="548" fill="#c8664c"/>
    <use href="#tree" x="118" y="508"/>

    <!-- Riverside -->
    <use href="#house" x="216" y="348" fill="#7f9db4"/>
    <use href="#house" x="214" y="398" fill="#b45a42"/>
    <use href="#house" x="336" y="346" fill="#7f9db4"/>
    <use href="#house" x="340" y="396" fill="#7f9db4"/>
    <use href="#house" x="218" y="566" fill="#7f9db4"/>
    <use href="#tree" x="262" y="350"/>
    <use href="#tree" x="358" y="470"/>
    <use href="#tree" x="266" y="578"/>
    <use href="#tree" x="358" y="572"/>
    <path d="M296 418 q9 7 18 0 l-3 5 h-12 z M305 402 v16 M305 404 l7 9 h-7" fill="#fff9ec" stroke-width="1"/>

    <!-- The Garden Quarter -->
    <use href="#dark" x="44" y="648"/>
    <use href="#dark" x="118" y="640"/>
    <use href="#dark" x="240" y="640"/>
    <use href="#dark" x="296" y="660"/>
    <use href="#dark" x="44" y="736"/>
    <use href="#dark" x="118" y="796"/>
    <use href="#dark" x="238" y="800"/>
    <use href="#dark" x="300" y="790"/>
    <use href="#house" x="58" y="716" fill="#8f7a8d"/>
    <use href="#house" x="248" y="752" fill="#8f7a8d"/>
    <use href="#lantern" x="148" y="650"/>
    <use href="#lantern" x="226" y="668"/>
    <use href="#lantern" x="150" y="766"/>
    <use href="#lantern" x="92" y="772"/>
    <use href="#lantern" x="292" y="728"/>
    <g fill="#c8664c" stroke="none"><circle cx="46" cy="772" r="1.8"/><circle cx="54" cy="778" r="1.8"/><circle cx="38" cy="780" r="1.8"/><circle cx="272" cy="702" r="1.8"/><circle cx="280" cy="708" r="1.8"/><circle cx="264" cy="710" r="1.8"/></g>

    <!-- A small compass, in the corner -->
    <g transform="translate(46 186)" fill="#fff9ec" stroke-width="1">
      <circle r="16"/>
      <path d="M0 -14 L4 0 L0 14 L-4 0 Z"/>
      <path d="M0 -14 L4 0 L-4 0 Z" fill="#bf4c39"/>
    </g>
  </g>
</svg>
