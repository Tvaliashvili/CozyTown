<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <!-- The town map, seen from above at a tilt, like a board game. No words in here: the names are real
       buttons on top, and each neighbourhood's territory is a tappable shape (src/map/places.js). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4f8c"/><stop offset="1" stop-color="#d9a0a0"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ebe4ee"/><stop offset="1" stop-color="#fff6e9"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9cf78"/><stop offset="1" stop-color="#8cbb66"/>
    </linearGradient>
    <linearGradient id="garden" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f8f66"/><stop offset="1" stop-color="#3f6650"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffd978" stop-opacity="0.9"/><stop offset="1" stop-color="#ffd978" stop-opacity="0"/></radialGradient>

    <!-- A house from above, at a tilt: a roof with two slopes, then a short front wall.
         The roof takes "fill", the walls take "color". -->
    <g id="house">
      <ellipse cx="18" cy="26" rx="19" ry="4" fill="#2f2a3a" opacity="0.14"/>
      <polygon points="3,0 31,0 34,16 0,16"/>
      <polygon points="3,0 31,0 32.5,8 1.5,8" fill="#fff" opacity="0.22"/>
      <rect x="2" y="16" width="30" height="10" fill="currentColor"/>
      <rect x="6" y="18" width="5" height="5" rx="1" fill="#ffd978"/>
      <rect x="23" y="18" width="5" height="5" rx="1" fill="#ffd978"/>
      <rect x="14.5" y="19" width="5" height="7" rx="1.5" fill="#8a5a3a"/>
    </g>
    <!-- Two floors with a carved wooden balcony: the Old Town's look. -->
    <g id="balcony">
      <ellipse cx="18" cy="32" rx="19" ry="4" fill="#2f2a3a" opacity="0.14"/>
      <polygon points="3,0 31,0 34,15 0,15"/>
      <polygon points="3,0 31,0 32.5,7.5 1.5,7.5" fill="#fff" opacity="0.22"/>
      <rect x="2" y="15" width="30" height="17" fill="currentColor"/>
      <rect x="6" y="17" width="5" height="5" rx="1" fill="#ffd978"/>
      <rect x="23" y="17" width="5" height="5" rx="1" fill="#ffd978"/>
      <rect x="0" y="22.5" width="34" height="2" fill="#7a4a2c"/>
      <path d="M2 24.5v4M6 24.5v4M10 24.5v4M14 24.5v4M18 24.5v4M22 24.5v4M26 24.5v4M30 24.5v4" stroke="#7a4a2c" stroke-width="1.2"/>
      <rect x="14.5" y="26" width="5" height="6" rx="1.5" fill="#6b4630"/>
    </g>
    <!-- Trees from above: a round crown with its light on the upper left -->
    <g id="tree">
      <ellipse cx="4" cy="6" rx="11" ry="5" fill="#2f2a3a" opacity="0.14"/>
      <circle r="10" fill="currentColor"/>
      <circle cx="-3" cy="-3" r="5" fill="#fff" opacity="0.18"/>
    </g>
    <g id="pine">
      <ellipse cx="4" cy="10" rx="9" ry="4" fill="#2f2a3a" opacity="0.14"/>
      <path d="M0 -12 L9 8 L-9 8 Z" fill="currentColor"/>
      <path d="M0 -12 L4 -3 L-4 -3 Z" fill="#fff6e9"/>
    </g>
    <g id="lantern">
      <circle r="10" fill="url(#glow)"/>
      <circle r="2.2" fill="#ffe29a"/>
    </g>
    <g id="flowers">
      <ellipse rx="26" ry="11" fill="#79a878"/>
      <g fill="#f3d4dc"><circle cx="-14" cy="-2" r="2.4"/><circle cx="-2" cy="4" r="2.4"/><circle cx="12" cy="-3" r="2.4"/></g>
      <g fill="#fff6e9"><circle cx="-8" cy="4" r="2"/><circle cx="6" cy="-5" r="2"/><circle cx="17" cy="4" r="2"/></g>
    </g>
  </defs>

  <!-- A thin band of evening sky at the far edge, with the peaks of the Snowy Hills against it -->
  <rect width="400" height="80" fill="url(#sky)"/>
  <circle cx="340" cy="26" r="11" fill="#fff1c9"/>
  <g fill="#fff6e9"><circle cx="40" cy="18" r="1.4" opacity="0.8"/><circle cx="130" cy="30" r="1.2" opacity="0.7"/><circle cx="220" cy="14" r="1.5" opacity="0.8"/></g>
  <path d="M-10 78 L50 28 L100 64 L160 22 L228 70 L290 36 L410 78 Z" fill="#8a7aa8"/>
  <path d="M50 28 L36 40 L46 38 L52 46 L60 38 L68 40 Z M160 22 L142 38 L154 34 L160 44 L168 34 L180 38 Z M290 36 L276 48 L286 46 L292 54 L300 46 L308 48 Z" fill="#fff6e9"/>

  <!-- Snowy Hills: snow-covered ground -->
  <path d="M-10 66 C60 76 120 60 200 70 C280 80 340 64 410 72 V180 C330 170 260 184 200 176 C130 168 70 182 -10 176 Z" fill="url(#snow)"/>

  <!-- The rest of the land -->
  <path d="M-10 176 C70 182 130 168 200 176 C260 184 330 170 410 180 V600 H-10 Z" fill="url(#ground)"/>

  <!-- The Garden Quarter, lower and calmer -->
  <path d="M-10 436 C60 424 130 440 200 432 C270 424 340 440 410 428 V600 H-10 Z" fill="url(#garden)"/>

  <!-- The river comes down from the hills, along Riverside, into the gardens -->
  <path d="M345 45 C360 110 280 150 300 210 C320 270 330 330 285 380 C250 420 300 470 330 520 C350 555 370 580 395 600" fill="none" stroke="#6fa8bd" stroke-width="26" stroke-linecap="round"/>
  <path d="M345 45 C360 110 280 150 300 210 C320 270 330 330 285 380 C250 420 300 470 330 520 C350 555 370 580 395 600" fill="none" stroke="#9fd0dc" stroke-width="14" stroke-linecap="round"/>
  <path d="M296 160 q6 -4 12 0 M318 300 q6 -4 12 0 M290 400 q6 -4 12 0 M332 525 q6 -4 12 0" fill="none" stroke="#e8f6f8" stroke-width="2" stroke-linecap="round"/>

  <!-- Roads: the main one runs down the middle, between the Old Town and Riverside -->
  <g fill="none" stroke-linecap="round">
    <path d="M200 70 C190 110 205 140 200 176 C195 230 205 290 198 350 C192 410 205 470 200 530 C197 560 190 585 185 600" stroke="#f0e2c8" stroke-width="14"/>
    <path d="M198 302 C175 302 150 306 134 306" stroke="#f0e2c8" stroke-width="10"/>
    <path d="M200 250 C240 248 270 250 296 250 L330 250 C350 250 365 248 400 245" stroke="#f0e2c8" stroke-width="10"/>
    <path d="M200 70 C190 110 205 140 200 176 C195 230 205 290 198 350 C192 410 205 470 200 530 C197 560 190 585 185 600" stroke="#dfcba6" stroke-width="1.5" stroke-dasharray="5 8"/>
    <!-- garden paths -->
    <path d="M200 470 C160 480 120 468 80 500 C60 516 50 540 40 560" stroke="#e9dcc0" stroke-width="6" opacity="0.8"/>
    <path d="M200 520 C240 528 262 552 300 566" stroke="#e9dcc0" stroke-width="6" opacity="0.8"/>
  </g>
  <!-- The bridge -->
  <path d="M296 250 L330 250" stroke="#7a4a2c" stroke-width="12" stroke-linecap="round"/>
  <path d="M296 250 L330 250" stroke="#c49a6c" stroke-width="7" stroke-linecap="round"/>

  <!-- Snowy Hills -->
  <g>
    <use href="#pine" x="22" y="100" color="#4f7a68"/>
    <use href="#pine" x="96" y="88" color="#5c8a72"/>
    <use href="#pine" x="160" y="150" color="#4f7a68"/>
    <use href="#pine" x="246" y="92" color="#5c8a72"/>
    <use href="#pine" x="386" y="120" color="#4f7a68"/>
    <use href="#pine" x="32" y="158" color="#5c8a72"/>
    <use href="#pine" x="258" y="160" color="#4f7a68"/>
    <use href="#house" x="46" y="112" fill="#fff6e9" color="#b98a7a"/>
    <use href="#house" x="118" y="128" fill="#fff6e9" color="#d9a48a"/>
    <use href="#house" x="222" y="118" fill="#fff6e9" color="#a98fa8"/>
    <use href="#house" x="352" y="146" fill="#fff6e9" color="#c98f7c"/>
  </g>

  <!-- Old Town: roofs close together around a little square, wooden balconies, a round stone tower -->
  <g>
    <rect x="56" y="276" width="78" height="56" rx="10" fill="#e8d5b7"/>
    <circle cx="95" cy="304" r="9" fill="#9fd0dc"/><circle cx="95" cy="304" r="3.5" fill="#e8f6f8"/>
    <use href="#balcony" x="8" y="188" fill="#bf4c39" color="#f6dfc0"/>
    <use href="#house" x="52" y="196" fill="#a85a3f" color="#e9b89a"/>
    <use href="#balcony" x="98" y="190" fill="#c8693f" color="#fff0d8"/>
    <use href="#house" x="146" y="204" fill="#bf4c39" color="#f3cfb0"/>
    <use href="#house" x="6" y="242" fill="#c8693f" color="#fff0d8"/>
    <use href="#balcony" x="150" y="252" fill="#a85a3f" color="#e4c7a4"/>
    <use href="#balcony" x="4" y="296" fill="#bf4c39" color="#f6dfc0"/>
    <use href="#house" x="4" y="352" fill="#a85a3f" color="#fff0d8"/>
    <use href="#balcony" x="50" y="346" fill="#c8693f" color="#e9b89a"/>
    <use href="#house" x="98" y="352" fill="#bf4c39" color="#f3cfb0"/>
    <use href="#balcony" x="148" y="340" fill="#a85a3f" color="#fff0d8"/>
    <use href="#house" x="22" y="398" fill="#c8693f" color="#f6dfc0"/>
    <use href="#house" x="74" y="402" fill="#bf4c39" color="#e4c7a4"/>
    <use href="#house" x="126" y="396" fill="#a85a3f" color="#f3cfb0"/>
    <!-- the tower -->
    <ellipse cx="172" cy="318" rx="12" ry="4" fill="#2f2a3a" opacity="0.14"/>
    <rect x="163" y="300" width="18" height="16" fill="#e8d5b7"/>
    <circle cx="172" cy="300" r="10" fill="#a85a3f"/><circle cx="169" cy="297" r="4" fill="#fff" opacity="0.22"/>
    <rect x="170" y="306" width="4" height="6" rx="2" fill="#ffd978"/>
    <use href="#tree" x="38" y="238" color="#6aa84f"/>
    <use href="#tree" x="186" y="400" color="#7dbb5a"/>
    <use href="#tree" x="8" y="222" color="#7dbb5a"/>
  </g>

  <!-- Riverside: houses along both banks, a boat -->
  <g>
    <use href="#house" x="214" y="198" fill="#5f7fa0" color="#fff0d8"/>
    <use href="#house" x="236" y="270" fill="#bf4c39" color="#f6dfc0"/>
    <use href="#tree" x="226" y="346" color="#7dbb5a"/>
    <use href="#house" x="228" y="392" fill="#c8693f" color="#e9d9c0"/>
    <use href="#house" x="352" y="200" fill="#c8693f" color="#fff0d8"/>
    <use href="#house" x="358" y="282" fill="#5f7fa0" color="#f6dfc0"/>
    <use href="#house" x="350" y="372" fill="#bf4c39" color="#e9d9c0"/>
    <use href="#tree" x="256" y="236" color="#7dbb5a"/>
    <use href="#tree" x="384" y="340" color="#6aa84f"/>
    <use href="#tree" x="270" y="330" color="#6aa84f"/>
    <use href="#tree" x="360" y="420" color="#7dbb5a"/>
    <use href="#tree" x="240" y="446" color="#6aa84f"/>
    <!-- a little boat -->
    <path d="M310 300 q12 9 24 0 l-3 6 h-18 z" fill="#7a4a2c"/>
    <path d="M322 284 v16 M322 286 l8 10 h-8" fill="#fff6e9" stroke="#fff6e9" stroke-width="1.2"/>
  </g>

  <!-- The Garden Quarter: trees, flower beds and small lanterns, a couple of quiet houses -->
  <g>
    <use href="#flowers" x="80" y="500"/>
    <use href="#flowers" x="300" y="560"/>
    <use href="#flowers" x="150" y="570"/>
    <use href="#tree" x="28" y="462" color="#3f7355"/>
    <use href="#tree" x="112" y="452" color="#4b8460"/>
    <use href="#tree" x="246" y="486" color="#3f7355"/>
    <use href="#tree" x="372" y="470" color="#4b8460"/>
    <use href="#tree" x="24" y="548" color="#3a6b50"/>
    <use href="#tree" x="372" y="560" color="#3a6b50"/>
    <use href="#tree" x="100" y="588" color="#44775a"/>
    <use href="#tree" x="228" y="590" color="#44775a"/>
    <use href="#house" x="40" y="530" fill="#6f5a6e" color="#eadfd0"/>
    <use href="#house" x="236" y="536" fill="#6f5a6e" color="#dfd3c4"/>
    <use href="#lantern" x="150" y="476"/>
    <use href="#lantern" x="252" y="462"/>
    <use href="#lantern" x="60" y="578"/>
    <use href="#lantern" x="178" y="548"/>
    <use href="#lantern" x="300" y="520"/>
    <use href="#lantern" x="130" y="528"/>
  </g>
</svg>
